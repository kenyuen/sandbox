version: '3.8'
services:
  es01:
    image: "${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:7.17.11}"
    container_name: es01
    restart: unless-stopped
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es02,es03,es04
      - cluster.initial_master_nodes=es01,es02,es03,es04
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - data01:/usr/share/elasticsearch/data
    networks:
      - elastic

  es02:
    image: "${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:7.17.11}"
    container_name: es02
    restart: unless-stopped
    environment:
      - node.name=es02
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es01,es03,es04
      - cluster.initial_master_nodes=es01,es02,es03,es04
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - data02:/usr/share/elasticsearch/data
    networks:
      - elastic

  es03:
    image: "${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:7.17.11}"
    container_name: es03
    restart: unless-stopped
    environment:
      - node.name=es03
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es01,es02,es04
      - cluster.initial_master_nodes=es01,es02,es03,es04
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - data03:/usr/share/elasticsearch/data
    networks:
      - elastic

  es04:
    image: "${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:7.17.11}"
    container_name: es04
    restart: unless-stopped
    environment:
      - node.name=es04
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es01,es02,es03
      - cluster.initial_master_nodes=es01,es02,es03,es04
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - data04:/usr/share/elasticsearch/data
    networks:
      - elastic

  node-proxy:
    image: local/node-proxy:latest
    build:
      context: ./node-proxy
      dockerfile: Dockerfile
    container_name: node-proxy
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - UPSTREAM_NODES=es01:9200,es02:9200,es03:9200,es04:9200
      - CHECK_INTERVAL=5
      - CHECK_TIMEOUT=2
      - MIN_HEALTHY=1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cat/health?h=status | grep -E 'green|yellow' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - elastic
    depends_on:
      - es01
      - es02
      - es03
      - es04

volumes:
  data01:
    driver: local
  data02:
    driver: local
  data03:
    driver: local
  data04:
    driver: local

networks:
  elastic:
    driver: bridge